[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feynmangraph"
dynamic = ["version"]
description = "Web frontend for building Feynman diagrams and exporting gammaloop-compatible .dot files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elijah Cavan", email = "eli_cavan@live.ca" }]
maintainers = [{ name = "Elijah Cavan", email = "eli_cavan@live.ca" }]
keywords = [
    "particle physics",
    "feynman diagrams",
    "quantum field theory",
    "QFT",
    "gammaloop",
    "linnet",
    "UFO",
    "BSM",
    "forward scattering",
    "fastapi",
    "reactflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "networkx>=3.3",
    "ufo-model-loader>=0.1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/ecavan/FeynmanGraph"
Repository = "https://github.com/ecavan/FeynmanGraph"
Issues = "https://github.com/ecavan/FeynmanGraph/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-networkx>=3.3",
]

[project.scripts]
feynmangraph = "feyngraph.__main__:main"

[tool.hatch.version]
path = "feyngraph/version.py"

[tool.hatch.build.targets.wheel]
packages = ["feyngraph"]
artifacts = ["feyngraph/data/frontend/**"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["feyngraph"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = [
    "gammaloop: tests that require the gammaloop binary to be installed (run nightly)",
]
